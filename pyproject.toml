[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Backend with Qdrant and Knowledge Graph"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "qdrant-client>=1.7.0",
    "fastembed>=0.2.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "httpx>=0.26.0"
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
