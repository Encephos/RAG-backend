services:
  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for persistence if needed outside of Qdrant
      - ./data:/app/data
      # Mount logs if you have file logging
      # - ./logs:/app/logs
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Add other environment variables here or use env_file
    env_file:
      - .env
    depends_on:
      - qdrant
    networks:
      - rag-network
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rag-network
    restart: always

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
